# Sentinel specification pack for Python web apps.
#
# These are ordinary Semgrep rules. Sentinel does not use them to report findings. It uses
# them to *locate* sources, sinks and sanitizers, and lifts every match into a Datalog fact
# (see sentinel/extract/semgrep_specs.py). Each rule declares its role in metadata.sentinel:
#   role: source | sink | sanitizer
#   cls:  vulnerability class (sinks, sanitizers) or `all` (sanitizers that neutralise everything)
#   kind: source kind (sources): http | cookie | cli | header
# Sinks must focus the *dangerous argument* (focus-metavariable) so the match span is exactly
# the expression that must not be attacker-controlled.
rules:
  # ───────────────────────────── sources ─────────────────────────────
  - id: spec.source.flask.request-params
    languages: [python]
    severity: INFO
    message: source
    metadata: {sentinel: {role: source, kind: http}}
    pattern-either:
      - pattern: flask.request.args.$M(...)
      - pattern: flask.request.args[...]
      - pattern: flask.request.form.$M(...)
      - pattern: flask.request.form[...]
      - pattern: flask.request.values.$M(...)
      - pattern: flask.request.get_json(...)
      - pattern: flask.request.get_data(...)
      - pattern: flask.request.data
      - pattern: flask.request.json
      - pattern: flask.request.url
      - pattern: flask.request.full_path
      - pattern: flask.request.path
      - pattern: flask.request.query_string
      - pattern: flask.request.view_args
      - pattern: flask.request.files[...].filename
      - pattern: flask.request.files.get(...).filename
      - pattern: flask.request.files[...]
      - pattern: flask.request.files.get(...)
  - id: spec.source.flask.cookies
    languages: [python]
    severity: INFO
    message: source
    metadata: {sentinel: {role: source, kind: cookie}}
    pattern-either:
      - pattern: flask.request.cookies.$M(...)
      - pattern: flask.request.cookies[...]
  - id: spec.source.flask.headers
    languages: [python]
    severity: INFO
    message: source
    metadata: {sentinel: {role: source, kind: header}}
    pattern-either:
      - pattern: flask.request.headers.$M(...)
      - pattern: flask.request.headers[...]
  - id: spec.source.archive.opened
    languages: [python]
    severity: INFO
    message: source
    # Member names inside an archive are chosen by whoever built it ("tar slip", CVE-2007-4559): weak until the
    # verifier establishes the archive can come from outside (download, upload, user path).
    metadata: {sentinel: {role: source, kind: archive}}
    pattern-either:
      - pattern: tarfile.open(...)
      - pattern: tarfile.TarFile(...)
      - pattern: tarfile.TarFile.open(...)
      - pattern: zipfile.ZipFile(...)
  # A remote server's reply is outside data: attacker-controlled when the server, the URL or the network path is
  # (user-configured endpoints, plugin hosts, model servers). Weak until a reachable attacker is established.
  - id: spec.source.network.http-client
    languages: [python]
    severity: INFO
    message: source
    metadata: {sentinel: {role: source, kind: network}}
    # The reply of a request call, not the client or session object (a session is configuration, not outside data).
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: requests.$M(...)
              - pattern: requests.Session().$M(...)
              - pattern: httpx.$M(...)
              - pattern: httpx.Client(...).$M(...)
              - pattern: httpx.AsyncClient(...).$M(...)
              - pattern: aiohttp.ClientSession(...).$M(...)
              - patterns:
                  - pattern-inside: |
                      $S = requests.Session(...)
                      ...
                  - pattern: $S.$M(...)
          - metavariable-regex: {metavariable: $M, regex: ^(get|post|put|patch|delete|head|options|request|stream)$}
      - pattern: urllib.request.urlopen(...)
      - pattern: urllib3.PoolManager(...).request(...)
      - pattern: sseclient.SSEClient(...)
  - id: spec.source.cli.argv
    languages: [python]
    severity: INFO
    message: source
    metadata: {sentinel: {role: source, kind: cli}}
    pattern-either:
      - pattern: sys.argv
      - pattern: $P.parse_args(...)
      - pattern: input(...)

  # ───────────────────────────── sinks ─────────────────────────────
  - id: spec.sink.sqli.dbapi-execute
    languages: [python]
    severity: INFO
    message: sink
    metadata: {sentinel: {role: sink, cls: sqli, cwe: CWE-89}}
    patterns:
      - pattern-either:
          - pattern: $CUR.execute($Q, ...)
          - pattern: $CUR.executemany($Q, ...)
          - pattern: $CUR.executescript($Q)
      - focus-metavariable: $Q
  - id: spec.sink.cmdi.os
    languages: [python]
    severity: INFO
    message: sink
    metadata: {sentinel: {role: sink, cls: cmdi, cwe: CWE-78}}
    patterns:
      - pattern-either:
          - pattern: os.system($X)
          - pattern: os.popen($X, ...)
      - focus-metavariable: $X
  - id: spec.sink.cmdi.subprocess-shell
    languages: [python]
    severity: INFO
    message: sink
    metadata: {sentinel: {role: sink, cls: cmdi, cwe: CWE-78}}
    patterns:
      - pattern-either:
          - pattern: subprocess.$F($X, ..., shell=True, ...)
      - metavariable-regex: {metavariable: $F, regex: ^(run|call|check_call|check_output|Popen)$}
      - focus-metavariable: $X
  # Without a shell, an attacker-controlled list element is still an argument the program parses: `-oProxyCommand=..`,
  # `--upload-pack=..`, `hg --config=alias...` (argument injection, CWE-88). Only list literals: the element is visible.
  - id: spec.sink.cmdi.subprocess-argv
    languages: [python]
    severity: INFO
    message: sink
    metadata: {sentinel: {role: sink, cls: cmdi, cwe: CWE-88}}
    patterns:
      - pattern-either:
          - pattern: subprocess.$F([..., $A, ...], ...)
          - pattern: os.execv($P, [..., $A, ...])
          - pattern: os.execvp($P, [..., $A, ...])
      - pattern-not: subprocess.$F($X, ..., shell=True, ...)
      - metavariable-regex: {metavariable: $F, regex: ^(run|call|check_call|check_output|Popen)$}
      - focus-metavariable: $A
  - id: spec.sink.path.file-access
    languages: [python]
    severity: INFO
    message: sink
    metadata: {sentinel: {role: sink, cls: path, cwe: CWE-22}}
    patterns:
      - pattern-either:
          - pattern: open($P, ...)
          - pattern: flask.send_file($P, ...)
          - pattern: os.remove($P)
          - pattern: shutil.rmtree($P, ...)
      - focus-metavariable: $P
  - id: spec.sink.path.archive-extract
    languages: [python]
    severity: INFO
    message: sink
    # Extracting every member writes wherever the member names point. A member filter (filter="data") is the fix.
    metadata: {sentinel: {role: sink, cls: path, cwe: CWE-22}}
    patterns:
      - pattern-either:
          - pattern: $A.extractall(...)
          - pattern: $A.extract(...)
      - pattern-not: $A.extractall(..., filter=$F, ...)
      - pattern-not: $A.extract(..., filter=$F, ...)
      - focus-metavariable: $A
  - id: spec.sink.ssti.render-template-string
    languages: [python]
    severity: INFO
    message: sink
    metadata: {sentinel: {role: sink, cls: ssti, cwe: CWE-1336}}
    patterns:
      - pattern: flask.render_template_string($T, ...)
      - focus-metavariable: $T
  # A template compiled from a string runs whatever expressions the string holds (Jinja2 `{{ cycler.__init__... }}`,
  # Mako `<% %>` blocks): the template text itself must not be attacker-controlled. Sandboxed environments are not sinks.
  - id: spec.sink.ssti.template-from-string
    languages: [python]
    severity: INFO
    message: sink
    metadata: {sentinel: {role: sink, cls: ssti, cwe: CWE-1336}}
    patterns:
      - pattern-either:
          - pattern: jinja2.Template($T, ...)
          - pattern: jinja2.Environment(...).from_string($T, ...)
          - pattern: jinja2.environment.Environment(...).from_string($T, ...)
          - patterns:
              - pattern-inside: |
                  $E = jinja2.Environment(...)
                  ...
              - pattern: $E.from_string($T, ...)
          - pattern: django.template.Template($T, ...)
          - pattern: django.template.engines[$N].from_string($T, ...)
          - pattern: mako.template.Template($T, ...)
      - focus-metavariable: $T
  - id: spec.sink.xss.markup
    languages: [python]
    severity: INFO
    message: sink
    metadata: {sentinel: {role: sink, cls: xss, cwe: CWE-79}}
    patterns:
      - pattern-either:
          - pattern: markupsafe.Markup($X)
          - pattern: flask.Markup($X)
          - pattern: django.utils.safestring.mark_safe($X)
          - pattern: django.utils.safestring.SafeString($X)
          - pattern: flask.make_response($X, ...)
      # Wrapping a response object (a file, JSON, a redirect, a rendered template) writes no attacker HTML.
      - pattern-not: flask.make_response(flask.send_file(...), ...)
      - pattern-not: flask.make_response(flask.send_from_directory(...), ...)
      - pattern-not: flask.make_response(flask.jsonify(...), ...)
      - pattern-not: flask.make_response(flask.redirect(...), ...)
      - pattern-not: flask.make_response(flask.render_template(...), ...)
      - focus-metavariable: $X
  - id: spec.sink.xss.route-returns-html
    languages: [python]
    severity: INFO
    message: sink
    metadata: {sentinel: {role: sink, cls: xss, cwe: CWE-79}}
    patterns:
      - pattern-inside: |
          @$APP.route(...)
          def $F(...):
            ...
      - pattern: return $E
      - pattern-not: return $FN(...)
      - metavariable-pattern:
          metavariable: $E
          pattern-either:
            - pattern: '"=~/<[a-zA-Z]/" + ...'
            - pattern: f"=~/<[a-zA-Z]/"
      - focus-metavariable: $E
  - id: spec.sink.ssrf.requests
    languages: [python]
    severity: INFO
    message: sink
    metadata: {sentinel: {role: sink, cls: ssrf, cwe: CWE-918}}
    patterns:
      - pattern-either:
          - pattern: requests.$M($U, ...)
          - pattern: urllib.request.urlopen($U, ...)
      - metavariable-regex: {metavariable: $M, regex: ^(get|post|put|delete|head|patch|request)$}
      - focus-metavariable: $U
  - id: spec.sink.deser.pickle
    languages: [python]
    severity: INFO
    message: sink
    metadata: {sentinel: {role: sink, cls: deser, cwe: CWE-502}}
    patterns:
      - pattern-either:
          - pattern: pickle.loads($X, ...)
          - pattern: pickle.load($X, ...)
          - pattern: pickle.Unpickler($X, ...)
          - pattern: cPickle.loads($X, ...)
          - pattern: cPickle.load($X, ...)
          - pattern: dill.loads($X, ...)
          - pattern: dill.load($X, ...)
          - pattern: cloudpickle.loads($X, ...)
          - pattern: cloudpickle.load($X, ...)
          - pattern: joblib.load($X, ...)
          - pattern: pandas.read_pickle($X, ...)
          - pattern: shelve.open($X, ...)
          - pattern: jsonpickle.decode($X, ...)
      - focus-metavariable: $X
  # Loaders that unpickle unless told not to: torch.load (weights_only=False was the default before 2.6),
  # numpy.load(allow_pickle=True).
  - id: spec.sink.deser.pickle-backed
    languages: [python]
    severity: INFO
    message: sink
    metadata: {sentinel: {role: sink, cls: deser, cwe: CWE-502}}
    patterns:
      - pattern-either:
          - patterns:
              - pattern: torch.load($X, ...)
              - pattern-not: torch.load($X, ..., weights_only=True, ...)
          - pattern: numpy.load($X, ..., allow_pickle=True, ...)
      - focus-metavariable: $X
  - id: spec.sink.deser.yaml-unsafe
    languages: [python]
    severity: INFO
    message: sink
    metadata: {sentinel: {role: sink, cls: deser, cwe: CWE-502}}
    patterns:
      - pattern-either:
          - pattern: yaml.load($X, ...)
          - pattern: yaml.load_all($X, ...)
          - pattern: yaml.unsafe_load($X, ...)
          - pattern: yaml.unsafe_load_all($X, ...)
      - pattern-not: yaml.load($X, Loader=yaml.SafeLoader)
      - pattern-not: yaml.load_all($X, Loader=yaml.SafeLoader)
      - pattern-not: yaml.load($X, Loader=yaml.CSafeLoader)
      - focus-metavariable: $X
  - id: spec.sink.code.eval
    languages: [python]
    severity: INFO
    message: sink
    metadata: {sentinel: {role: sink, cls: code, cwe: CWE-95}}
    patterns:
      - pattern-either:
          - pattern: eval($X, ...)
          - pattern: exec($X, ...)
      - focus-metavariable: $X
  - id: spec.sink.redirect.flask
    languages: [python]
    severity: INFO
    message: sink
    metadata: {sentinel: {role: sink, cls: redirect, cwe: CWE-601}}
    patterns:
      - pattern-either:
          - pattern: flask.redirect($U, ...)
          - pattern: django.shortcuts.redirect($U, ...)
          - pattern: django.http.HttpResponseRedirect($U, ...)
          - pattern: starlette.responses.RedirectResponse($U, ...)
          - pattern: fastapi.responses.RedirectResponse($U, ...)
          - pattern: $R.headers["Location"] = $U
          - pattern: $R.headers['Location'] = $U
      - focus-metavariable: $U

  # ───────────────────────────── sanitizers ─────────────────────────────
  - id: spec.sanitizer.type-cast
    languages: [python]
    severity: INFO
    message: sanitizer
    metadata: {sentinel: {role: sanitizer, cls: all}}
    pattern-either:
      - pattern: int(...)
      - pattern: float(...)
      - pattern: uuid.UUID(...)
  - id: spec.sanitizer.path.basename
    languages: [python]
    severity: INFO
    message: sanitizer
    metadata: {sentinel: {role: sanitizer, cls: path}}
    pattern-either:
      - pattern: os.path.basename(...)
      - pattern: werkzeug.utils.secure_filename(...)
  - id: spec.sanitizer.xss.escape
    languages: [python]
    severity: INFO
    message: sanitizer
    metadata: {sentinel: {role: sanitizer, cls: xss}}
    pattern-either:
      - pattern: markupsafe.escape(...)
      - pattern: html.escape(...)
      - pattern: flask.escape(...)
      - pattern: django.utils.html.escape(...)
      - pattern: django.utils.html.conditional_escape(...)
      - pattern: django.utils.html.format_html(...)
  - id: spec.sanitizer.cmdi.shlex-quote
    languages: [python]
    severity: INFO
    message: sanitizer
    metadata: {sentinel: {role: sanitizer, cls: cmdi}}
    pattern: shlex.quote(...)
