# Ground truth for the demo corpus. Lives OUTSIDE the scanned repositories so it can never
# leak into what the engine or the agent sees. Key = (repo, function containing the source, vuln class).
# label: tp = real, exploitable vulnerability; fp = would be a false positive if reported.
# Entries with `expect_flow: false` have no dangerous flow at all; reporting them is a FP.
acme-shop:
  - {fn: product,              cls: sqli,     label: fp, why: "<int:> route converter"}
  - {fn: search,               cls: sqli,     label: tp, why: "interprocedural: search_products -> build_search_sql -> run_query"}
  - {fn: user_profile,         cls: sqli,     label: fp, why: "isdigit() early-exit guard"}
  - {fn: order_lookup,         cls: sqli,     label: fp, why: "custom sanitizer acme_common.db.quote_sql"}
  - {fn: orders_by_customer,   cls: sqli,     label: fp, why: "parameterized query", expect_flow: false}
  - {fn: export_catalog,       cls: cmdi,     label: tp, why: "os.system with concatenated input"}
  - {fn: convert_image,        cls: cmdi,     label: fp, why: "argv list, no shell", expect_flow: false}
  - {fn: thumbnail,            cls: path,     label: fp, why: "os.path.basename"}
  - {fn: download,             cls: path,     label: tp, why: "os.path.join with raw input"}
  - {fn: hello,                cls: xss,      label: fp, why: "markupsafe.escape"}
  - {fn: greet,                cls: ssti,     label: tp, why: "render_template_string with input"}
  - {fn: link_preview,         cls: ssrf,     label: tp, why: "interprocedural: acme_common.net.fetch"}
  - {fn: avatar,               cls: ssrf,     label: fp, why: "host allow-list in fetch_allowed"}
  - {fn: import_catalog,       cls: deser,    label: fp, why: "yaml.safe_load", expect_flow: false}
  - {fn: import_legacy,        cls: deser,    label: tp, why: "yaml.load with yaml.Loader"}
  - {fn: cart,                 cls: deser,    label: tp, why: "pickle.loads of cookie"}
  - {fn: sales_report,         cls: sqli,     label: fp, why: "int() cast"}
  - {fn: coupon,               cls: sqli,     label: fp, why: "sha256 hexdigest output is hex"}
  - {fn: category,             cls: sqli,     label: fp, why: "slugify output is [a-z0-9-]"}
  - {fn: login,                cls: redirect, label: tp, why: "redirect to user-controlled next"}
  - {fn: ping,                 cls: cmdi,     label: tp, why: "shell=True with concatenated input"}
  - {fn: legacy_debug_console, cls: code,     label: fp, why: "dead code: not routed, never called"}
  - {fn: test_replay_fixture,  cls: cmdi,     label: fp, why: "test-only utility"}
acme-billing:
  - {fn: list_invoices,        cls: sqli,     label: tp, why: "interprocedural via invoices._customer_filter"}
  - {fn: invoice,              cls: sqli,     label: fp, why: "<int:> route converter"}
  - {fn: invoice_search,       cls: sqli,     label: fp, why: "custom sanitizer quote_sql (learnable from acme-shop triage)"}
  - {fn: invoice_by_plan,      cls: sqli,     label: fp, why: "is_safe_slug regex guard"}
  - {fn: invoice_pdf,          cls: cmdi,     label: fp, why: "is_safe_slug regex guard"}
  - {fn: invoice_pdf,          cls: path,     label: fp, why: "is_safe_slug regex guard"}
  - {fn: invoice_raw,          cls: path,     label: tp, why: "path traversal via invoice_path"}
  - {fn: archive,              cls: cmdi,     label: tp, why: "run_shell with concatenated input"}
  - {fn: webhook_test,         cls: ssrf,     label: tp, why: "interprocedural fetch"}
  - {fn: statements,           cls: path,     label: fp, why: "isalnum() guard"}
  - {fn: attachment,           cls: path,     label: tp, why: "single-pass ../ stripping is bypassable with ....//"}
# acme-admin installs acme_common as a package (not vendored): the helper bodies are not in the repo.
acme-admin:
  - {fn: backup,               cls: cmdi,     label: tp, why: "run_shell (installed helper) with concatenated input"}
  - {fn: backup_safe,          cls: cmdi,     label: fp, why: "shlex.quote before run_shell"}
  - {fn: user_search,          cls: sqli,     label: tp, why: "run_query (installed helper) with concatenated input"}
  - {fn: user_by_ref,          cls: sqli,     label: fp, why: "quote_sql inside a quoted literal, through run_query"}
  - {fn: user_lookup,          cls: sqli,     label: fp, why: "quote_sql inside a quoted literal, cursor.execute"}
  - {fn: user_by_id,           cls: sqli,     label: fp, why: "parameterized run_query", expect_flow: false}
  - {fn: audit_log,            cls: sqli,     label: tp, why: "interprocedural: audit.load_audit -> run_query"}
  - {fn: health_probe,         cls: ssrf,     label: tp, why: "fetch (installed helper) with user URL"}
  - {fn: cdn_probe,            cls: ssrf,     label: fp, why: "fetch_allowed checks a host allow-list", expect_flow: false}
  - {fn: run_report,           cls: cmdi,     label: fp, why: "argv list via run_cmd, no shell", expect_flow: false}
  - {fn: export_users,         cls: cmdi,     label: tp, why: "os.system with concatenated input"}
# acme-reports uses sinks and sources the curated spec pack does not model (pandas, jinja2.Template,
# subprocess.getoutput, lxml, urllib3, marshal, FastAPI, AWS Lambda): recall depends on frontier inference.
acme-reports:
  - {fn: sales_report,         cls: sqli,     label: tp, why: "pandas.read_sql with concatenated query"}
  - {fn: team_report,          cls: sqli,     label: fp, why: "pandas.read_sql with bound params", expect_flow: false}
  - {fn: disk_usage,           cls: cmdi,     label: tp, why: "subprocess.getoutput with concatenated input"}
  - {fn: render_custom,        cls: ssti,     label: tp, why: "jinja2.Template built from user input"}
  - {fn: greeting,             cls: ssti,     label: fp, why: "constant template, user value passed as render variable", expect_flow: false}
  - {fn: import_xml,           cls: xxe,      label: tp, why: "lxml parser with resolve_entities=True on request body"}
  - {fn: webhook,              cls: ssrf,     label: tp, why: "urllib3 request to user-supplied URL"}
  - {fn: load_cached,          cls: deser,    label: tp, why: "marshal.loads of request body"}
  - {fn: page_title,           cls: xss,      label: fp, why: "logged and returned as JSON", expect_flow: false}
  - {fn: get_report,           cls: cmdi,     label: tp, why: "FastAPI query param into shell=True"}
  - {fn: search_reports,       cls: sqli,     label: tp, why: "FastAPI query param concatenated into sqlalchemy text()"}
  - {fn: report_owner,         cls: sqli,     label: fp, why: "FastAPI path param typed int"}
  - {fn: handler,              cls: cmdi,     label: tp, why: "Lambda event body into os.system"}

# acme-etl reuses libraries acme-reports taught the engine about (pandas, subprocess.getoutput, lxml, FastAPI)
# plus two it has not seen (dill, FastAPI APIRouter().post): frontier answers should transfer.
acme-etl:
  - {fn: preview_job,          cls: sqli,     label: tp, why: "table name from request into pandas.read_sql"}
  - {fn: count_rows,           cls: sqli,     label: fp, why: "int parameter"}
  - {fn: archive,              cls: cmdi,     label: fp, why: "shlex.quote"}
  - {fn: compress,             cls: cmdi,     label: tp, why: "path into subprocess.getoutput"}
  - {fn: import_feed,          cls: xxe,      label: tp, why: "lxml resolve_entities=True on request body"}
  - {fn: restore,              cls: deser,    label: tp, why: "dill.loads of request body"}
  - {fn: job_status,           cls: sqli,     label: fp, why: "bound params", expect_flow: false}
